<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berita Instansi</title>
<meta name="description" content="Portal berita resmi instansi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a56a8;
    --primary-dark: #0f3d7a;
    --accent: #e8f0fb;
    --text: #1a1a2e;
    --muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f9fafb;
    --white: #ffffff;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

  /* HEADER */
  header {
    background: var(--primary);
    color: white;
    padding: 0 1.5rem;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header-inner {
    max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .site-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; }
  .logo-icon { width: 38px; height: 38px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .logo-text .name { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .logo-text .tagline { font-size: 11px; opacity: 0.75; }
  .header-nav { display: flex; gap: 4px; }
  .header-nav a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 13.5px; transition: background 0.15s; }
  .header-nav a:hover { background: rgba(255,255,255,0.15); color: white; }
  .header-admin { background: rgba(255,255,255,0.18); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 6px 14px; border-radius: 8px; font-size: 13px; text-decoration: none; font-weight: 500; transition: background 0.15s; }
  .header-admin:hover { background: rgba(255,255,255,0.28); }

  /* HERO */
  .hero { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); color: white; padding: 3.5rem 1.5rem 5rem; }
  .hero-inner { max-width: 1100px; margin: 0 auto; }
  .hero h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 700; margin-bottom: 0.75rem; }
  .hero p { font-size: 1rem; opacity: 0.8; max-width: 500px; }
  .search-wrap { margin-top: 1.75rem; display: flex; gap: 8px; max-width: 480px; }
  .search-wrap input { flex: 1; padding: 10px 16px; border-radius: 10px; border: none; font-size: 14px; font-family: inherit; outline: none; }
  .search-wrap button { background: white; color: var(--primary); border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 13.5px; cursor: pointer; }

  /* MAIN */
  .main-wrap { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }
  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 2rem; margin-top: -2.5rem; }

  /* CATEGORIES */
  .cat-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .cat-btn { padding: 5px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: white; font-size: 13px; cursor: pointer; color: var(--muted); font-family: inherit; transition: all 0.15s; }
  .cat-btn.active, .cat-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

  /* NEWS CARDS */
  .news-grid { display: flex; flex-direction: column; gap: 1rem; }
  .news-card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex; text-decoration: none; color: inherit; transition: box-shadow 0.2s, transform 0.2s; }
  .news-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .news-card.featured { flex-direction: column; }
  .news-card.featured .card-img { height: 220px; }
  .card-img { width: 160px; flex-shrink: 0; overflow: hidden; background: var(--accent); }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-img .no-img { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2rem; background: var(--accent); }
  .card-body { padding: 1rem 1.25rem; flex: 1; display: flex; flex-direction: column; }
  .card-cat { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--primary); margin-bottom: 6px; }
  .card-title { font-size: 15px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; color: var(--text); }
  .news-card.featured .card-title { font-size: 18px; }
  .card-excerpt { font-size: 13.5px; color: var(--muted); line-height: 1.5; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-meta { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .card-meta-dot { width: 3px; height: 3px; background: var(--border); border-radius: 50%; }

  /* PAGINATION */
  .pagination { display: flex; justify-content: center; gap: 6px; margin: 2rem 0; }
  .page-btn { width: 36px; height: 36px; border-radius: 8px; border: 1.5px solid var(--border); background: white; cursor: pointer; font-size: 13.5px; font-family: inherit; color: var(--text); display: flex; align-items: center; justify-content: center; }
  .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  .page-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

  /* SIDEBAR */
  .sidebar { padding-top: 0; }
  .sidebar-card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.25rem; margin-bottom: 1.25rem; }
  .sidebar-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--primary); margin-bottom: 1rem; }
  .popular-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; }
  .popular-item:last-child { border-bottom: none; }
  .popular-num { font-size: 18px; font-weight: 700; color: var(--border); min-width: 24px; line-height: 1; }
  .popular-title { font-size: 13px; color: var(--text); line-height: 1.4; font-weight: 500; }
  .popular-date { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .cat-list { display: flex; flex-direction: column; gap: 6px; }
  .cat-link { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 8px; font-size: 13.5px; text-decoration: none; color: var(--text); transition: background 0.15s; }
  .cat-link:hover { background: var(--accent); color: var(--primary); }
  .cat-count { font-size: 12px; background: var(--accent); color: var(--primary); padding: 2px 8px; border-radius: 20px; font-weight: 600; }

  /* LOADING */
  .loading { text-align: center; padding: 3rem; color: var(--muted); }
  .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 3rem; color: var(--muted); }
  .empty-icon { font-size: 3rem; margin-bottom: 1rem; }

  /* FOOTER */
  footer { background: var(--text); color: rgba(255,255,255,0.7); padding: 2.5rem 1.5rem; margin-top: 3rem; }
  .footer-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
  .footer-brand { font-size: 14px; }
  .footer-brand strong { color: white; display: block; margin-bottom: 4px; }
  .footer-links { display: flex; gap: 16px; }
  .footer-links a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 13px; }
  .footer-links a:hover { color: white; }

  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .news-card { flex-direction: column; }
    .card-img { width: 100%; height: 160px; }
    .header-nav { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="site-logo" href="index.html">
      <div class="logo-icon">🏛️</div>
      <div class="logo-text">
        <div class="name" id="site-name">Nama Instansi</div>
        <div class="tagline" id="site-tagline">Portal Informasi Resmi</div>
      </div>
    </a>
    <nav class="header-nav">
      <a href="index.html">Beranda</a>
      <a href="#berita">Berita</a>
      <a href="#tentang">Tentang</a>
    </nav>
    <a class="header-admin" href="admin/index.html">⚙ Admin</a>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Portal Berita <span id="hero-name">Instansi</span></h1>
    <p>Informasi resmi, kegiatan, dan pengumuman terkini</p>
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Cari berita...">
      <button onclick="doSearch()">Cari</button>
    </div>
  </div>
</section>

<div class="main-wrap">
  <div class="layout">
    <main id="berita">
      <div class="cat-bar" id="cat-bar">
        <button class="cat-btn active" onclick="filterCat('', this)">Semua</button>
      </div>
      <div class="news-grid" id="news-grid">
        <div class="loading"><div class="loading-spinner"></div>Memuat berita...</div>
      </div>
      <div class="pagination" id="pagination"></div>
    </main>

    <aside class="sidebar">
      <div class="sidebar-card">
        <div class="sidebar-title">Berita Populer</div>
        <div id="popular-list">
          <div class="loading" style="padding:1rem 0"><div class="loading-spinner" style="width:20px;height:20px;border-width:2px"></div></div>
        </div>
      </div>
      <div class="sidebar-card">
        <div class="sidebar-title">Kategori</div>
        <div class="cat-list" id="cat-list"></div>
      </div>
    </aside>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <div class="footer-brand">
      <strong id="footer-name">Nama Instansi</strong>
      <span id="footer-tagline">Portal Informasi Resmi</span>
    </div>
    <div class="footer-links">
      <a href="admin/index.html">Admin Panel</a>
      <a href="#tentang">Tentang</a>
    </div>
  </div>
</footer>

<script src="public/assets/config.js"></script>
<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const POSTS_PER_PAGE = 8;
let allPosts = [];
let filteredPosts = [];
let currentPage = 1;
let currentCat = '';

// Apply site config
if (typeof SITE_CONFIG !== 'undefined') {
  document.getElementById('site-name').textContent = SITE_CONFIG.name || 'Nama Instansi';
  document.getElementById('site-tagline').textContent = SITE_CONFIG.tagline || 'Portal Informasi Resmi';
  document.getElementById('hero-name').textContent = SITE_CONFIG.name || 'Instansi';
  document.getElementById('footer-name').textContent = SITE_CONFIG.name || 'Nama Instansi';
  document.getElementById('footer-tagline').textContent = SITE_CONFIG.tagline || 'Portal Informasi Resmi';
  if (SITE_CONFIG.name) document.title = SITE_CONFIG.name + ' — Berita';
}

// ── FETCH POSTS ──────────────────────────────────────────────────────────────
async function loadPosts() {
  try {
    const cfg = typeof SITE_CONFIG !== 'undefined' ? SITE_CONFIG : {};
    const owner = cfg.github_owner || '';
    const repo  = cfg.github_repo  || '';
    const branch= cfg.github_branch|| 'main';

    if (!owner || !repo) {
      renderDemoData();
      return;
    }

    const url = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/posts/index.json?t=${Date.now()}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('index.json tidak ditemukan');
    const index = await res.json();

    allPosts = (index.posts || [])
      .filter(p => p.status === 'published')
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    renderAll();
  } catch (e) {
    console.warn('Fallback demo:', e.message);
    renderDemoData();
  }
}

function renderDemoData() {
  allPosts = [
    { slug:'rapat-koordinasi-2025', title:'Rapat Koordinasi Tingkat Kabupaten Semester I 2025', category:'Kegiatan', date:'2025-05-15', excerpt:'Instansi menyelenggarakan rapat koordinasi untuk membahas program kerja semester pertama tahun 2025.', image:'' },
    { slug:'bantuan-sosial-warga', title:'Penyerahan Bantuan Sosial kepada Warga Terdampak', category:'Sosial', date:'2025-05-12', excerpt:'Sebanyak 150 paket bantuan sosial diserahkan kepada warga yang terdampak bencana di wilayah Kecamatan Sragen Tengah.', image:'' },
    { slug:'hut-instansi-30', title:'Peringatan HUT Instansi ke-30 Berlangsung Meriah', category:'Agenda', date:'2025-05-08', excerpt:'Rangkaian acara HUT ke-30 dirayakan dengan berbagai kegiatan melibatkan seluruh pegawai dan masyarakat sekitar.', image:'' },
    { slug:'pengumuman-pelayanan', title:'Pengumuman Perubahan Jam Pelayanan Publik', category:'Pengumuman', date:'2025-05-01', excerpt:'Mulai 5 Mei 2025 jam pelayanan publik disesuaikan untuk meningkatkan kualitas layanan kepada masyarakat.', image:'' },
    { slug:'pelatihan-sdm-2025', title:'Pelatihan Peningkatan SDM Pegawai Angkatan III', category:'Kegiatan', date:'2025-04-28', excerpt:'Sebanyak 45 pegawai mengikuti pelatihan peningkatan kompetensi yang diselenggarakan selama tiga hari.', image:'' },
    { slug:'kunjungan-kerja-gubernur', title:'Kunjungan Kerja Gubernur Jawa Tengah ke Sragen', category:'Kegiatan', date:'2025-04-20', excerpt:'Gubernur Jawa Tengah melakukan kunjungan kerja untuk meninjau langsung program pembangunan daerah di Kabupaten Sragen.', image:'' },
  ];
  renderAll();
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function renderAll() {
  buildCategoryUI();
  applyFilter();
}

function buildCategoryUI() {
  const cats = [...new Set(allPosts.map(p => p.category))].filter(Boolean);
  const catBar = document.getElementById('cat-bar');
  const catList = document.getElementById('cat-list');

  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.textContent = cat;
    btn.onclick = () => filterCat(cat, btn);
    catBar.appendChild(btn);

    const count = allPosts.filter(p => p.category === cat).length;
    const a = document.createElement('a');
    a.className = 'cat-link';
    a.href = '#';
    a.innerHTML = `${cat}<span class="cat-count">${count}</span>`;
    a.onclick = (e) => { e.preventDefault(); filterCat(cat, btn); };
    catList.appendChild(a);
  });

  buildPopular();
}

function buildPopular() {
  const list = document.getElementById('popular-list');
  const top = allPosts.slice(0, 5);
  list.innerHTML = top.map((p, i) => `
    <a class="popular-item" href="public/berita/${p.slug}.html">
      <div class="popular-num">0${i+1}</div>
      <div>
        <div class="popular-title">${p.title}</div>
        <div class="popular-date">${formatDate(p.date)}</div>
      </div>
    </a>`).join('');
}

function filterCat(cat, btn) {
  currentCat = cat;
  currentPage = 1;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  applyFilter();
}

function doSearch() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  filteredPosts = q
    ? allPosts.filter(p => p.title.toLowerCase().includes(q) || (p.excerpt||'').toLowerCase().includes(q))
    : allPosts.filter(p => !currentCat || p.category === currentCat);
  currentPage = 1;
  renderGrid();
}

function applyFilter() {
  filteredPosts = currentCat ? allPosts.filter(p => p.category === currentCat) : [...allPosts];
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('news-grid');
  const start = (currentPage - 1) * POSTS_PER_PAGE;
  const page  = filteredPosts.slice(start, start + POSTS_PER_PAGE);

  if (!filteredPosts.length) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div>Tidak ada berita ditemukan.</div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  grid.innerHTML = page.map((p, idx) => cardHTML(p, idx === 0 && currentPage === 1 && !currentCat)).join('');
  renderPagination();
}

function cardHTML(p, featured) {
  const imgHTML = p.image
    ? `<img src="${p.image}" alt="${p.title}" loading="lazy">`
    : `<div class="no-img">📰</div>`;
  return `
    <a class="news-card${featured ? ' featured' : ''}" href="public/berita/${p.slug}.html">
      <div class="card-img">${imgHTML}</div>
      <div class="card-body">
        <div class="card-cat">${p.category || 'Berita'}</div>
        <div class="card-title">${p.title}</div>
        <div class="card-excerpt">${p.excerpt || ''}</div>
        <div class="card-meta">
          <span>${formatDate(p.date)}</span>
          ${p.author ? `<span class="card-meta-dot"></span><span>${p.author}</span>` : ''}
        </div>
      </div>
    </a>`;
}

function renderPagination() {
  const total = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);
  if (total <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
  let html = '';
  for (let i = 1; i <= total; i++) {
    html += `<button class="page-btn${i===currentPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
  }
  document.getElementById('pagination').innerHTML = html;
}

function goPage(n) { currentPage = n; renderGrid(); window.scrollTo({ top: 300, behavior: 'smooth' }); }

function formatDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
}

loadPosts();
</script>
</body>
</html>
