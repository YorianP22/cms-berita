<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CMS Berita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f4fc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .login-box { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); padding: 2.5rem 2rem; width: 100%; max-width: 400px; }
  .login-logo { text-align: center; margin-bottom: 2rem; }
  .login-icon { width: 64px; height: 64px; background: #1a56a8; border-radius: 16px; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .login-title { font-size: 22px; font-weight: 700; color: #1a1a2e; }
  .login-sub { font-size: 14px; color: #6b7280; margin-top: 4px; }
  .form-group { margin-bottom: 1.25rem; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  .form-input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1.5px solid #e5e7eb; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
  .form-input:focus { border-color: #1a56a8; box-shadow: 0 0 0 3px rgba(26,86,168,0.12); }
  .form-hint { font-size: 12px; color: #9ca3af; margin-top: 5px; }
  .form-hint a { color: #1a56a8; }
  .login-btn { width: 100%; padding: 11px; background: #1a56a8; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; margin-top: 0.5rem; }
  .login-btn:hover { background: #0f3d7a; }
  .login-btn:active { transform: scale(0.99); }
  .error-msg { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 1rem; display: none; }
  .error-msg.show { display: block; }
  .divider { text-align: center; font-size: 12px; color: #9ca3af; margin: 1.5rem 0 1rem; }
  .back-link { text-align: center; margin-top: 1.5rem; font-size: 13px; color: #6b7280; }
  .back-link a { color: #1a56a8; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <div class="login-icon">🏛️</div>
    <div class="login-title">Admin Panel</div>
    <div class="login-sub" id="site-name-display">CMS Berita Instansi</div>
  </div>

  <div class="error-msg" id="error-msg">❌ Token tidak valid atau tidak punya akses ke repo ini.</div>

  <div class="form-group">
    <label class="form-label">GitHub Personal Access Token</label>
    <input class="form-input" type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxxxxxx" autocomplete="current-password">
    <div class="form-hint">
      Buat token di <a href="https://github.com/settings/tokens/new" target="_blank">GitHub → Settings → Developer Settings → Personal Access Tokens</a>.<br>
      Centang scope: <strong>repo</strong> (full control of private repositories).
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">GitHub Owner (username/org)</label>
    <input class="form-input" type="text" id="owner-input" placeholder="nama-username-github">
  </div>

  <div class="form-group">
    <label class="form-label">Nama Repository</label>
    <input class="form-input" type="text" id="repo-input" placeholder="nama-repo">
  </div>

  <div class="form-group">
    <label class="form-label">Branch</label>
    <input class="form-input" type="text" id="branch-input" value="main">
  </div>

  <button class="login-btn" id="login-btn" onclick="doLogin()">Masuk ke Admin Panel</button>

  <div class="back-link"><a href="../index.html">← Kembali ke situs</a></div>
</div>

<script src="../public/assets/config.js"></script>
<script>
// Pre-fill dari config.js jika sudah ada
if (typeof SITE_CONFIG !== 'undefined') {
  if (SITE_CONFIG.name) document.getElementById('site-name-display').textContent = SITE_CONFIG.name;
  if (SITE_CONFIG.github_owner) document.getElementById('owner-input').value = SITE_CONFIG.github_owner;
  if (SITE_CONFIG.github_repo)  document.getElementById('repo-input').value  = SITE_CONFIG.github_repo;
  if (SITE_CONFIG.github_branch)document.getElementById('branch-input').value = SITE_CONFIG.github_branch;
}

// Jika sudah login sebelumnya, langsung ke dashboard
const saved = localStorage.getItem('cms_session');
if (saved) {
  try { const s = JSON.parse(saved); if (s.token && s.owner && s.repo) location.href = 'cms.html'; } catch(e) {}
}

// Enter key
document.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const token  = document.getElementById('token-input').value.trim();
  const owner  = document.getElementById('owner-input').value.trim();
  const repo   = document.getElementById('repo-input').value.trim();
  const branch = document.getElementById('branch-input').value.trim() || 'main';
  const btn    = document.getElementById('login-btn');
  const errEl  = document.getElementById('error-msg');

  errEl.classList.remove('show');
  if (!token || !owner || !repo) { errEl.textContent = '⚠️ Semua field wajib diisi.'; errEl.classList.add('show'); return; }

  btn.textContent = 'Memverifikasi...'; btn.disabled = true;

  try {
    // Verifikasi token dengan cek akses repo
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, {
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (res.status === 401) throw new Error('Token tidak valid.');
    if (res.status === 404) throw new Error(`Repo "${owner}/${repo}" tidak ditemukan atau tidak punya akses.`);
    if (!res.ok) throw new Error('Gagal verifikasi: ' + res.status);

    // Simpan sesi
    localStorage.setItem('cms_session', JSON.stringify({ token, owner, repo, branch, loginAt: Date.now() }));
    location.href = 'cms.html';
  } catch (e) {
    errEl.textContent = '❌ ' + e.message;
    errEl.classList.add('show');
    btn.textContent = 'Masuk ke Admin Panel';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
